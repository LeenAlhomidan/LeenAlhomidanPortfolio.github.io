			<stop offset="1" stop-color="#1d4b4b"/>
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#d8bb83"/>
			<stop offset="1" stop-color="#f1dfb7"/>
