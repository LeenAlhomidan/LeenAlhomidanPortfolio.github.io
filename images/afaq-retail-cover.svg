	</defs>
	<rect width="800" height="500" rx="28" fill="url(#background)"/>
	<circle cx="400" cy="252" r="157" fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="2"/>
	<circle cx="400" cy="252" r="112" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="5 10"/>
	<path d="M400 84a168 168 0 0 1 168 168" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
	<path d="m553 244 15 8-15 9" fill="none" stroke="#f1dfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
	<path d="M568 252a168 168 0 0 1-168 168" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
	<path d="m408 412-8 8-9-8" fill="none" stroke="#f1dfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
	<path d="M400 420a168 168 0 0 1-168-168" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
	<path d="m240 260-8-8 8-9" fill="none" stroke="#f1dfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
	<path d="M232 252A168 168 0 0 1 400 84" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
	<path d="m392 92 8-8 9 8" fill="none" stroke="#f1dfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
