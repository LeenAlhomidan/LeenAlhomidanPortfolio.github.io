<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
	<title id="title">مسار الدورة المحاسبية لشركة أفق للتجزئة</title>
	<desc id="desc">تصور مرئي لمراحل التأسيس والتسجيل والمطابقة والإقفال والتقارير</desc>
