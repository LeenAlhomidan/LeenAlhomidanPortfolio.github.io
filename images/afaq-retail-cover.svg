	<rect x="300" y="186" width="200" height="132" rx="18" fill="#f4f1e9"/>
	<path d="M342 220h116M342 243h116M342 266h76" fill="none" stroke="#76908a" stroke-width="7" stroke-linecap="round"/>
	<path d="m423 277 14 14 27-33" fill="none" stroke="#bd9c61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
